# Axis Financeiro — satélite do Axis. Banco PRÓPRIO (nunca o do Core); mesma VPS, containers adicionais.
services:
  financeiro-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${FINANCEIRO_DB_PASSWORD:-financeiro}
      POSTGRES_DB: axis_financeiro
    ports:
      - "5434:5432" # só para desenvolvimento; em produção remova e deixe apenas a rede interna
    volumes:
      - financeiro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d axis_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  financeiro-backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://financeiro:${FINANCEIRO_DB_PASSWORD:-financeiro}@financeiro-postgres:5432/axis_financeiro?schema=public
      SCHEDULER_ENABLED: "true" # exatamente UMA instância do backend com o agendador ligado
    depends_on:
      financeiro-postgres:
        condition: service_healthy
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  financeiro-frontend:
    build:
      context: ./frontend
      args:
        VITE_AXIS_URL: ${AXIS_PUBLIC_URL:-http://localhost:3000/api/v1} # login do Core chamado pelo navegador (CORS liberado no Core)
    restart: unless-stopped
    depends_on:
      - financeiro-backend
    ports:
      - "5175:80"

volumes:
  financeiro_postgres_data:
