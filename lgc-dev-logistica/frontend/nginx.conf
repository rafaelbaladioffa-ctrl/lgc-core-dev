server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O service worker nunca fica em cache: uma versão nova do app chega no próximo carregamento.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # A API fica no mesmo domínio do PWA (sem CORS) — o backend é o serviço da Logística.
    location /api/ {
        proxy_pass http://logistica-backend:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
